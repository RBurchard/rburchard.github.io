name: Update Publications

on:
  schedule:
    # Runs daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and merge publications from ORCID & OpenAlex
        run: python scripts/update_publications.py

      - name: Commit and push if publications changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/pinned.json
          if git diff --staged --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "chore(publications): auto-update publications from ORCID & OpenAlex"
            git push
          fi
